description: >
  Secret variables (SPEC §4.5.1, §6, §11.2). Secrets reach the app as plain
  values after injection. A runner also checks that no error output contains
  the raw value of a secret variable.
vars:
  DATABASE_URL:
    type: url
    description: Database connection string
    secret: true
    required: true
    schemes: [postgres]
  API_TOKEN:
    type: string
    description: Token for the billing API
    secret: true
    minLength: 20
  VAULT_HINT:
    type: string
    description: Not a secret, so a reference-like value is just text
cases:
  - name: secrets as injected values
    env: {DATABASE_URL: "postgres://app:s3cr3t@db:5432/app", API_TOKEN: "tok_0123456789abcdefghij"}
    expect: {DATABASE_URL: "postgres://app:s3cr3t@db:5432/app", API_TOKEN: "tok_0123456789abcdefghij"}
  - name: an unresolved vault reference
    env: {DATABASE_URL: "vault:secret/data/app/db#url"}
    errors: [{var: DATABASE_URL, code: invalid_type}]
  - name: an unresolved 1Password reference
    env: {DATABASE_URL: "postgres://db/app", API_TOKEN: "op://Production/billing/token-long-enough"}
    errors: [{var: API_TOKEN, code: invalid_type}]
  - name: an unresolved vals reference
    env: {DATABASE_URL: "ref+awssecrets://app/db#/url"}
    errors: [{var: DATABASE_URL, code: invalid_type}]
  - name: a secret that violates its constraints
    env: {DATABASE_URL: "mysql://app:hunter2@db/app", API_TOKEN: "short-secret-value"}
    errors: [{var: DATABASE_URL, code: invalid_scheme}, {var: API_TOKEN, code: out_of_range}]
  - name: reference prefixes only matter on secrets
    env: {DATABASE_URL: "postgres://db/app", VAULT_HINT: "vault:secret/data/x"}
    expect: {DATABASE_URL: "postgres://db/app", VAULT_HINT: "vault:secret/data/x"}
