description: Integer variables (SPEC §4.3, §5).
vars:
  PORT:
    type: int
    description: Port to listen on
    min: 1
    max: 65535
    default: 8080
  OFFSET:
    type: int
    description: Signed offset applied to every index
cases:
  - name: typed values
    values: {PORT: 9090, OFFSET: -42}
  - name: defaults and absent optionals
    values: {}
  - name: zero
    values: {OFFSET: 0}
  - name: below min
    env: {PORT: "0"}
    errors: [{var: PORT, code: out_of_range}]
  - name: above max
    env: {PORT: "65536"}
    errors: [{var: PORT, code: out_of_range}]
  - name: not an integer
    env: {PORT: "80.5"}
    errors: [{var: PORT, code: invalid_type}]
  - name: not a number
    env: {OFFSET: "ten"}
    errors: [{var: OFFSET, code: invalid_type}]
  - name: empty is unset, so the default applies
    env: {PORT: ""}
    expect: {PORT: 8080}
  - name: the largest 64-bit integer
    requires: [int64]
    env: {OFFSET: "9223372036854775807"}
    expect: {OFFSET: 9223372036854775807}
  - name: beyond the 64-bit range
    env: {OFFSET: "99999999999999999999"}
    errors: [{var: OFFSET, code: out_of_range}]
