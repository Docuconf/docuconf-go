name: release

# Two independent release trains, each started by its own tag. Neither uses
# `v*`: plain v tags version the SDK module (github.com/docuconf/docuconf-go),
# which Go resolves from the tag alone. See RELEASING.md.
#
#   cmd/docuconf/v0.1.0  the CLI module. Go requires this prefix for the
#                        cmd/docuconf module, so `go install
#                        github.com/docuconf/docuconf-go/cmd/docuconf@v0.1.0`
#                        resolves the same tag. Publishes:
#                        - CLI binaries (linux, darwin, windows; amd64, arm64)
#                          with SHA256SUMS on the GitHub Release;
#                        - ghcr.io/docuconf/docuconf:0.1.0 (and :latest),
#                          linux/amd64 and linux/arm64.
#   chart-v0.1.0         the Helm library chart in helm/docuconf (version
#                        must match Chart.yaml). Publishes
#                        oci://ghcr.io/docuconf/charts/docuconf:0.1.0 and
#                        attaches the chart .tgz to the GitHub Release.
#
# Everything uses the workflow's own GITHUB_TOKEN: no accounts, no secrets.
on:
  push:
    tags: ["cmd/docuconf/v*", "chart-v*"]

permissions:
  contents: read

jobs:
  # The CLI checks from go.yml, on the tagged commit.
  cli-test:
    if: startsWith(github.ref_name, 'cmd/docuconf/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#cmd/docuconf/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not cmd/docuconf/v<semver>" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - name: CLI
        working-directory: cmd/docuconf
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go build ./...
          go vet ./...
          go test ./...

  cli-binaries:
    needs: cli-test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
      packages: write
    env:
      VERSION: ${{ needs.cli-test.outputs.version }}
      PRERELEASE: ${{ needs.cli-test.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: cmd/docuconf/go.sum
      - name: Build
        working-directory: cmd/docuconf
        run: |
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="docuconf_${VERSION}_${os}_${arch}"
            exe=docuconf
            if [ "$os" = windows ]; then exe=docuconf.exe; fi
            mkdir -p "$out/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$out/$name/$exe" .
            cp "$GITHUB_WORKSPACE/LICENSE" "$out/$name/"
            if [ "$os" = windows ]; then
              (cd "$out" && zip -qr "$name.zip" "$name")
            else
              tar -C "$out" -czf "$out/$name.tar.gz" "$name"
            fi
            rm -rf "${out:?}/$name"
          done
          cd "$out" && sha256sum docuconf_* > SHA256SUMS && cat SHA256SUMS
      - name: Attach the binaries to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            notes=$(printf 'docuconf CLI %s.\n\nInstall with `go install github.com/docuconf/docuconf-go/cmd/docuconf@v%s`, download a binary below (checked against `SHA256SUMS`), or use the image `ghcr.io/docuconf/docuconf:%s`.\n' "$VERSION" "$VERSION" "$VERSION")
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "docuconf CLI $VERSION" --notes "$notes" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  cli-image:
    needs: cli-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    env:
      VERSION: ${{ needs.cli-test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/docuconf/docuconf
          # :latest only for releases, not pre-releases.
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ needs.cli-test.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=docuconf
            org.opencontainers.image.description=The docuconf CLI: export, vet and render configuration contracts.
            org.opencontainers.image.source=https://github.com/docuconf/docuconf-go
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
      - uses: docker/build-push-action@v6
        with:
          context: cmd/docuconf
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The Helm library chart. Gated by the checks from helm.yml.
  chart:
    if: startsWith(github.ref_name, 'chart-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
      packages: write # push to oci://ghcr.io/docuconf/charts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - run: go install helm.sh/helm/v3/cmd/helm@latest
      - name: Check the tag matches Chart.yaml
        run: |
          version=$(sed -n 's/^version: *//p' helm/docuconf/Chart.yaml)
          if [ "chart-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match helm/docuconf/Chart.yaml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: |
          examples/helm/gateway/generate.sh
          examples/helm/catalog/generate.sh
          git diff --exit-code -- examples/helm
      - run: pip install pyyaml
      - run: helm/test.sh
      - name: Package and push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          helm package helm/docuconf --destination dist
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/docuconf-$VERSION.tgz" oci://ghcr.io/docuconf/charts
      - name: Attach the chart to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
            notes=$(printf 'docuconf Helm library chart %s.\n\n```yaml\ndependencies:\n  - name: docuconf\n    version: %s\n    repository: oci://ghcr.io/docuconf/charts\n```\n' "$VERSION" "$VERSION")
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "docuconf Helm chart $VERSION" --notes "$notes" "${flags[@]}"
          fi
          (cd dist && sha256sum "docuconf-$VERSION.tgz" > "docuconf-$VERSION.tgz.sha256")
          gh release upload "$GITHUB_REF_NAME" "dist/docuconf-$VERSION.tgz" "dist/docuconf-$VERSION.tgz.sha256" --clobber
