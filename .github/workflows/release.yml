name: release

# Two independent release trains, each started by its own tag. Neither uses
# `v*`: plain v tags version the SDK module (github.com/docuconf/docuconf-go),
# which Go resolves from the tag alone. See RELEASING.md.
#
#   cmd/docuconf/v0.1.0  the CLI module. Go requires this prefix for the
#                        cmd/docuconf module, so `go install
#                        github.com/docuconf/docuconf-go/cmd/docuconf@v0.1.0`
#                        resolves the same tag. Publishes:
#                        - CLI binaries (linux, darwin, windows; amd64, arm64)
#                          with SHA256SUMS on the GitHub Release;
#                        - ghcr.io/docuconf/docuconf:0.1.0 (and :latest),
#                          linux/amd64 and linux/arm64.
#   chart-v0.1.0         the Helm library chart in helm/docuconf (version
#                        must match Chart.yaml). Publishes
#                        oci://ghcr.io/docuconf/charts/docuconf:0.1.0 and
#                        attaches the chart .tgz to the GitHub Release.
#
# Everything uses the workflow's own GITHUB_TOKEN: no accounts, no secrets.
#
# Signing is keyless cosign: each signing job gets a short-lived certificate
# from Sigstore's Fulcio for the job's GitHub OIDC identity (hence
# `id-token: write`), and the signature is logged in Rekor. RELEASING.md
# shows how to verify. Every archive and the image also get an SPDX SBOM.
on:
  push:
    tags: ["cmd/docuconf/v*", "chart-v*"]

permissions:
  contents: read

jobs:
  # The CLI checks from go.yml, on the tagged commit.
  cli-test:
    if: startsWith(github.ref_name, 'cmd/docuconf/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#cmd/docuconf/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not cmd/docuconf/v<semver>" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - name: CLI
        working-directory: cmd/docuconf
        run: |
          # shellcheck disable=SC2046 # one argument per file
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go build ./...
          go vet ./...
          go test ./...

  cli-binaries:
    needs: cli-test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
      packages: write
      id-token: write # keyless cosign signature of SHA256SUMS
    env:
      VERSION: ${{ needs.cli-test.outputs.version }}
      PRERELEASE: ${{ needs.cli-test.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: cmd/docuconf/go.sum
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        id: syft
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build
        working-directory: cmd/docuconf
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="docuconf_${VERSION}_${os}_${arch}"
            exe=docuconf
            if [ "$os" = windows ]; then exe=docuconf.exe; fi
            mkdir -p "$out/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$out/$name/$exe" .
            cp "$GITHUB_WORKSPACE/LICENSE" "$out/$name/"
            # An SPDX SBOM of what goes into the archive: the Go modules
            # compiled into the binary, read from its build info.
            "$SYFT" scan "dir:$out/$name" --source-name "$name" --source-version "$VERSION" \
              -o "spdx-json=$out/$name.spdx.json"
            if [ "$os" = windows ]; then
              (cd "$out" && zip -qr "$name.zip" "$name")
            else
              tar -C "$out" -czf "$out/$name.tar.gz" "$name"
            fi
            rm -rf "${out:?}/$name"
          done
          # SHA256SUMS covers the archives and their SBOMs.
          cd "$out" && sha256sum docuconf_* > SHA256SUMS && cat SHA256SUMS
      - name: Sign SHA256SUMS
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Attach the binaries to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            # shellcheck disable=SC2016 # the backticks are Markdown
            notes=$(printf 'docuconf CLI %s.\n\nInstall with `go install github.com/docuconf/docuconf-go/cmd/docuconf@v%s`, download a binary below (checked against `SHA256SUMS`), or use the image `ghcr.io/docuconf/docuconf:%s`.\n' "$VERSION" "$VERSION" "$VERSION")
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "docuconf CLI $VERSION" --notes "$notes" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  cli-image:
    needs: cli-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io, and the image's signature and SBOM attestation
      id-token: write # keyless cosign signing
    env:
      VERSION: ${{ needs.cli-test.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/docuconf/docuconf
          # :latest only for releases, not pre-releases.
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ needs.cli-test.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=docuconf
            org.opencontainers.image.description=The docuconf CLI: export, vet and render configuration contracts.
            org.opencontainers.image.source=https://github.com/docuconf/docuconf-go
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: cmd/docuconf
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Signed by digest, so the signature covers the multi-arch index and
      # every tag that points at it.
      - name: Sign the image
        env:
          IMAGE: ghcr.io/docuconf/docuconf@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      # The SBOM is read from the linux/amd64 image; both platforms hold the
      # same static binary built from the same modules.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/docuconf/docuconf@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the image SBOM
        env:
          IMAGE: ghcr.io/docuconf/docuconf@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate image.spdx.json "$IMAGE"

  # The Helm library chart. Gated by the checks from helm.yml.
  chart:
    if: startsWith(github.ref_name, 'chart-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
      packages: write # push to oci://ghcr.io/docuconf/charts, and the chart's signature
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - run: go install helm.sh/helm/v3/cmd/helm@latest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Check the tag matches Chart.yaml
        run: |
          version=$(sed -n 's/^version: *//p' helm/docuconf/Chart.yaml)
          if [ "chart-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match helm/docuconf/Chart.yaml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: |
          examples/helm/gateway/generate.sh
          examples/helm/catalog/generate.sh
          git diff --exit-code -- examples/helm
      - run: pip install pyyaml
      - run: helm/test.sh
      - name: Package and push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          helm package helm/docuconf --destination dist
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          set -o pipefail
          helm push "dist/docuconf-$VERSION.tgz" oci://ghcr.io/docuconf/charts 2>&1 | tee dist/push.log
          digest=$(sed -n 's/^Digest: *//p' dist/push.log)
          rm dist/push.log
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not read the chart digest from helm push" >&2
            exit 1
          fi
          echo "CHART_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Sign the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "ghcr.io/docuconf/charts/docuconf@$CHART_DIGEST"
      - name: Attach the chart to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
            # shellcheck disable=SC2016 # the backticks are Markdown
            notes=$(printf 'docuconf Helm library chart %s.\n\n```yaml\ndependencies:\n  - name: docuconf\n    version: %s\n    repository: oci://ghcr.io/docuconf/charts\n```\n' "$VERSION" "$VERSION")
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "docuconf Helm chart $VERSION" --notes "$notes" "${flags[@]}"
          fi
          (cd dist && sha256sum "docuconf-$VERSION.tgz" > "docuconf-$VERSION.tgz.sha256")
          gh release upload "$GITHUB_REF_NAME" "dist/docuconf-$VERSION.tgz" "dist/docuconf-$VERSION.tgz.sha256" --clobber
