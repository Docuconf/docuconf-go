name: examples

on:
  push:
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]

jobs:
  orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Install the docuconf CLI
        working-directory: cmd/docuconf
        run: go install .
      # Includes readme_test.go, which checks every snippet in the SDK
      # README against this example, smoke.sh and this workflow.
      - name: Build and test
        working-directory: examples/orders
        run: |
          test -z "$(gofmt -l .)"
          go build ./...
          go vet ./...
          go test ./...
      # contract.cue is generated; it must match what the exporter writes
      # today, except metadata.generator.version, which release PRs bump.
      # These are the README's commands.
      - name: Contract is up to date
        working-directory: examples/orders
        run: |
          go tool docuconf-export -pkg ./internal/config -name orders-api -package orders -o contract.cue
          ../../scripts/check-generated.sh contract.cue
          # Keep the committed contract (and its version) for the docs below.
          git checkout -- contract.cue
          go tool docuconf-export -pkg ./internal/config -name orders-api -package orders -check contract.cue
      - name: Contract passes the meta-schema
        run: |
          mod="$(mktemp -d)"
          cp -r spec/cue/cue.mod spec/cue/contract "$mod/"
          mkdir "$mod/orders"
          cp examples/orders/contract.cue "$mod/orders/"
          cd "$mod" && cue vet -c ./orders
      # CONFIG.md, CONFIG.agents.md and docs.json are generated from the
      # contract; they must match what docuconf docs writes today, and the
      # committed docs model must render the same docs. These are the
      # README's commands.
      - name: Generated docs are up to date
        working-directory: examples/orders
        run: |
          docuconf docs contract.cue -o CONFIG.md
          docuconf docs contract.cue --format agents -o CONFIG.agents.md
          docuconf docs contract.cue --format model -o docs.json
          git diff --exit-code -- CONFIG.md CONFIG.agents.md docs.json
          docuconf docs contract.cue --check CONFIG.md
          docuconf docs contract.cue --format agents --check CONFIG.agents.md
          docuconf docs docs.json --format markdown --check CONFIG.md
          docuconf docs docs.json --format agents --check CONFIG.agents.md
      - name: The README's platform inputs pass vet and render
        working-directory: examples/orders
        run: |
          docuconf vet -contract contract.cue -values deploy/values.yaml -files deploy/files.yaml
          docuconf render -contract contract.cue -values deploy/values.yaml -files deploy/files.yaml
      - name: Smoke test
        run: examples/orders/smoke.sh

  # The orders service deployed from Terraform (deploy/terraform): the
  # committed module is what docuconf terraform generates from the
  # contract, and the plan passes docuconf lint. These are the README's
  # commands.
  orders-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Install the docuconf CLI
        working-directory: cmd/docuconf
        run: go install .
      - name: Module is up to date
        working-directory: examples/orders
        run: docuconf terraform -contract contract.cue -out deploy/terraform/modules/orders-config -check
      - name: Plan and lint
        working-directory: examples/orders/deploy/terraform
        env:
          # Planning creates nothing, so no cluster is needed.
          KUBE_HOST: https://127.0.0.1:6443
        run: |
          terraform fmt -check -recursive
          terraform init -input=false
          terraform validate
          terraform plan -refresh=false -out plan.out
          terraform show -json plan.out > plan.json
          docuconf lint terraform plan.json -contract ../../contract.cue -explain

  # The same service on ECS, Cloud Run and Azure Container Apps
  # (deploy/ecs, deploy/cloudrun, deploy/containerapps): the committed
  # module is what docuconf terraform -target generates, and the plan
  # passes docuconf lint. Planning needs no cloud account: the job copies
  # in an override file that configures the provider without credentials.
  orders-cloud:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ecs, cloudrun, containerapps]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Install the docuconf CLI
        working-directory: cmd/docuconf
        run: go install .
      - name: Module is up to date
        working-directory: examples/orders
        run: docuconf terraform -contract contract.cue -target ${{ matrix.target }} -out deploy/${{ matrix.target }}/modules/orders-config -check
      - name: Plan and lint
        working-directory: examples/orders/deploy/${{ matrix.target }}
        run: |
          terraform fmt -check -recursive
          cp ci/provider_override.tf .
          terraform init -input=false
          terraform validate
          # azurerm needs a token before it plans: ci/fakeazure serves one.
          # Its certificate is trusted only from here on, after init has
          # downloaded the providers.
          if [ -d ci/fakeazure ]; then
            (cd ../.. && go build -o "$RUNNER_TEMP/fakeazure" ./deploy/${{ matrix.target }}/ci/fakeazure)
            "$RUNNER_TEMP/fakeazure" -ca "$RUNNER_TEMP/fakeazure-ca.pem" > "$RUNNER_TEMP/fakeazure-host" &
            for _ in $(seq 50); do [ -s "$RUNNER_TEMP/fakeazure-host" ] && break; sleep 0.1; done
            ARM_METADATA_HOSTNAME=$(cat "$RUNNER_TEMP/fakeazure-host")
            export ARM_METADATA_HOSTNAME SSL_CERT_FILE="$RUNNER_TEMP/fakeazure-ca.pem"
          fi
          terraform plan -refresh=false -out plan.out
          terraform show -json plan.out > plan.json
          docuconf lint terraform plan.json -contract ../../contract.cue -explain

  # deploy/terraform applied to a kind cluster, and the running service
  # checked against what the module rendered: see
  # deploy/terraform/e2e/e2e.sh.
  orders-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: helm/kind-action@v1
        with:
          cluster_name: orders-e2e
      - name: Install the docuconf CLI
        working-directory: cmd/docuconf
        run: go install .
      - name: End-to-end test
        env:
          KIND_CLUSTER: orders-e2e
        run: examples/orders/deploy/terraform/e2e/e2e.sh
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get all,certificates,configmaps,secrets -n orders -o wide || true
          kubectl -n orders describe pods || true
          kubectl -n orders logs -l app=orders-api --all-containers --prefix || true

  # The SDK and docuconf-export promise Go 1.24 without a toolchain
  # download, as on distro packages and pinned CI images.
  go124:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: go test ./...
      - working-directory: examples/orders
        run: |
          go test ./...
          go tool docuconf-export -pkg ./internal/config -name orders-api -package orders -check contract.cue

  # The orders service deployed from Pulumi (deploy/pulumi): the committed
  # component is what docuconf pulumi generates from the contract, the
  # program type-checks, its preview passes the policy pack
  # (deploy/pulumi-policy/kubernetes) and docuconf lint pulumi, `pulumi
  # up` renders manifests that match docuconf render of the same inputs,
  # and a forbidden value fails at preview. The
  # kubernetes provider renders YAML to a directory, so no cluster is needed.
  orders-pulumi:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: ""
      PULUMI_SKIP_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/orders/deploy/pulumi/package-lock.json
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.274.0
      - run: pip install pyyaml
      - name: Install the docuconf CLI
        working-directory: cmd/docuconf
        run: go install .
      - name: Component is up to date
        working-directory: examples/orders
        run: docuconf pulumi -contract contract.cue -out deploy/pulumi/orders-config -check
      - name: Policy pack is up to date
        working-directory: examples/orders
        run: docuconf pulumi policy -contract contract.cue -target kubernetes -out deploy/pulumi-policy/kubernetes -check
      - name: Render and compare with docuconf render
        working-directory: examples/orders/deploy/pulumi
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .
          mkdir -p "$RUNNER_TEMP/pulumi-state"
          pulumi login "file://$RUNNER_TEMP/pulumi-state"
          pulumi stack init ci
          pulumi config set renderDir "$RUNNER_TEMP/rendered"
          (cd ../pulumi-policy/kubernetes && npm ci --no-audit --no-fund)
          pulumi preview --json --non-interactive --policy-pack ../pulumi-policy/kubernetes > "$RUNNER_TEMP/preview.json"
          docuconf lint pulumi "$RUNNER_TEMP/preview.json" -contract ../../contract.cue -explain
          pulumi up --yes --non-interactive
          docuconf render -contract ../../contract.cue -values ../values.yaml -files ../files.yaml > "$RUNNER_TEMP/render.yaml"
          ./check-rendered.py "$RUNNER_TEMP/render.yaml" "$RUNNER_TEMP/rendered"
      - name: A forbidden value fails at preview
        working-directory: examples/orders/deploy/pulumi
        run: |
          pulumi config set workerCount 100
          if pulumi preview --non-interactive > "$RUNNER_TEMP/preview.txt" 2>&1; then
            cat "$RUNNER_TEMP/preview.txt"; echo "the preview accepted WORKER_COUNT = 100"; exit 1
          fi
          cat "$RUNNER_TEMP/preview.txt"
          grep -q "WORKER_COUNT: must be at most 64 (got 100)" "$RUNNER_TEMP/preview.txt"

  # The same program in Go (deploy/pulumi-go), through docuconf pulumi
  # -lang go: the committed component is up to date and formatted, the
  # program builds, its preview passes the policy pack and docuconf lint
  # pulumi, its manifests
  # match docuconf render (ConfigMap content
  # by meaning: a Go map has no key order), and a forbidden value fails at
  # preview.
  orders-pulumi-go:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: ""
      PULUMI_SKIP_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: examples/orders/deploy/pulumi-go/go.sum
      # The policy pack runs on node.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/orders/deploy/pulumi-policy/kubernetes/package-lock.json
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.274.0
      - run: pip install pyyaml
      - name: Install the docuconf CLI
        working-directory: cmd/docuconf
        run: go install .
      - name: Component is up to date
        working-directory: examples/orders
        run: docuconf pulumi -contract contract.cue -lang go -out deploy/pulumi-go/ordersapiconfig -check
      - name: Render and compare with docuconf render
        working-directory: examples/orders/deploy/pulumi-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          mkdir -p "$RUNNER_TEMP/pulumi-state"
          pulumi login "file://$RUNNER_TEMP/pulumi-state"
          pulumi stack init ci
          pulumi config set renderDir "$RUNNER_TEMP/rendered"
          (cd ../pulumi-policy/kubernetes && npm ci --no-audit --no-fund)
          pulumi preview --json --non-interactive --policy-pack ../pulumi-policy/kubernetes > "$RUNNER_TEMP/preview.json"
          docuconf lint pulumi "$RUNNER_TEMP/preview.json" -contract ../../contract.cue -explain
          pulumi up --yes --non-interactive
          docuconf render -contract ../../contract.cue -values ../values.yaml -files ../files.yaml > "$RUNNER_TEMP/render.yaml"
          ../pulumi/check-rendered.py --by-meaning "$RUNNER_TEMP/render.yaml" "$RUNNER_TEMP/rendered"
      - name: A forbidden value fails at preview
        working-directory: examples/orders/deploy/pulumi-go
        run: |
          pulumi config set workerCount 100
          if pulumi preview --non-interactive > "$RUNNER_TEMP/preview.txt" 2>&1; then
            cat "$RUNNER_TEMP/preview.txt"; echo "the preview accepted WORKER_COUNT = 100"; exit 1
          fi
          cat "$RUNNER_TEMP/preview.txt"
          grep -q "WORKER_COUNT: 100 is above max 64" "$RUNNER_TEMP/preview.txt"

  # The same program in Python (deploy/pulumi-python), through docuconf
  # pulumi -lang python: the committed component is up to date, the preview
  # passes the policy pack and docuconf lint pulumi, the manifests match
  # docuconf render (ConfigMap content by meaning: PyYAML writes YAML its
  # own way), and a forbidden value fails at preview.
  orders-pulumi-python:
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: ""
      PULUMI_SKIP_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            examples/orders/deploy/pulumi-python/requirements.txt
            examples/orders/deploy/pulumi-python/orders_api_config/requirements.txt
      # The policy pack runs on node.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/orders/deploy/pulumi-policy/kubernetes/package-lock.json
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.274.0
      - run: pip install pyyaml
      - name: Install the docuconf CLI
        working-directory: cmd/docuconf
        run: go install .
      - name: Component is up to date
        working-directory: examples/orders
        run: docuconf pulumi -contract contract.cue -lang python -out deploy/pulumi-python/orders_api_config -check
      - name: Render and compare with docuconf render
        working-directory: examples/orders/deploy/pulumi-python
        run: |
          pulumi install
          mkdir -p "$RUNNER_TEMP/pulumi-state"
          pulumi login "file://$RUNNER_TEMP/pulumi-state"
          pulumi stack init ci
          pulumi config set renderDir "$RUNNER_TEMP/rendered"
          (cd ../pulumi-policy/kubernetes && npm ci --no-audit --no-fund)
          pulumi preview --json --non-interactive --policy-pack ../pulumi-policy/kubernetes > "$RUNNER_TEMP/preview.json"
          docuconf lint pulumi "$RUNNER_TEMP/preview.json" -contract ../../contract.cue -explain
          pulumi up --yes --non-interactive
          docuconf render -contract ../../contract.cue -values ../values.yaml -files ../files.yaml > "$RUNNER_TEMP/render.yaml"
          ../pulumi/check-rendered.py --by-meaning "$RUNNER_TEMP/render.yaml" "$RUNNER_TEMP/rendered"
      - name: A forbidden value fails at preview
        working-directory: examples/orders/deploy/pulumi-python
        run: |
          pulumi config set workerCount 100
          if pulumi preview --non-interactive > "$RUNNER_TEMP/preview.txt" 2>&1; then
            cat "$RUNNER_TEMP/preview.txt"; echo "the preview accepted WORKER_COUNT = 100"; exit 1
          fi
          cat "$RUNNER_TEMP/preview.txt"
          grep -q "WORKER_COUNT: Input should be less than or equal to 64" "$RUNNER_TEMP/preview.txt"

  # The ECS and Cloud Run programs (deploy/pulumi-ecs, pulumi-cloudrun,
  # pulumi-go-ecs, pulumi-go-cloudrun): the committed component is what
  # docuconf pulumi -target generates, the program plans what the
  # Terraform root of its target plans, its preview passes the target's
  # policy pack and docuconf lint pulumi, and a forbidden value fails at
  # preview. Previews need no cloud account: see deploy/check-cloud-plan.sh.
  orders-pulumi-cloud:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { program: pulumi-ecs, target: ecs, lang: typescript, out: orders-config }
          - { program: pulumi-cloudrun, target: cloudrun, lang: typescript, out: orders-config }
          - { program: pulumi-go-ecs, target: ecs, lang: go, out: ordersapiconfig }
          - { program: pulumi-go-cloudrun, target: cloudrun, lang: go, out: ordersapiconfig }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.lang == 'go' && format('examples/orders/deploy/{0}/go.sum', matrix.program) || 'cmd/docuconf/go.sum' }}
      # The policy pack runs on node, for a Go program too.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/orders/deploy/pulumi-policy/${{ matrix.target }}/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.274.0
      - name: Install the docuconf CLI
        working-directory: cmd/docuconf
        run: go install .
      - name: Component is up to date
        working-directory: examples/orders
        run: docuconf pulumi -contract contract.cue -target ${{ matrix.target }} -lang ${{ matrix.lang }} -out deploy/${{ matrix.program }}/${{ matrix.out }} -check
      - name: Policy pack is up to date
        working-directory: examples/orders
        run: docuconf pulumi policy -contract contract.cue -target ${{ matrix.target }} -out deploy/pulumi-policy/${{ matrix.target }} -check
      - name: Plan, compare with Terraform, and refuse a forbidden value
        run: examples/orders/deploy/check-cloud-plan.sh ${{ matrix.target }} examples/orders/deploy/${{ matrix.program }}

  # deploy/pulumi, deploy/pulumi-go and deploy/pulumi-python deployed to a
  # kind cluster, and the running service checked against what the
  # component rendered, as orders-e2e does for Terraform: see
  # deploy/pulumi/e2e.sh.
  orders-pulumi-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        program: [pulumi, pulumi-go, pulumi-python]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: examples/orders/deploy/pulumi-go/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/orders/deploy/pulumi/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.274.0
      - uses: helm/kind-action@v1
        with:
          cluster_name: orders-e2e
      - name: Install the docuconf CLI
        working-directory: cmd/docuconf
        run: go install .
      - name: End-to-end test
        env:
          KIND_CLUSTER: orders-e2e
        run: examples/orders/deploy/pulumi/e2e.sh examples/orders/deploy/${{ matrix.program }}
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get all,certificates,configmaps,secrets -n orders -o wide || true
          kubectl -n orders describe pods || true
          kubectl -n orders logs -l app=orders-api --all-containers --prefix || true
