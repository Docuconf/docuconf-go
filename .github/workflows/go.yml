name: go

on:
  push:
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]

jobs:
  # function-docuconf, the Crossplane function in cmd/docuconf/fn: its own
  # module, on the Go its dependencies need, and its image.
  function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/docuconf/fn/go.mod
          cache-dependency-path: cmd/docuconf/fn/go.sum
      - name: Test
        working-directory: cmd/docuconf/fn
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
      - name: Image
        run: docker build -f fn/Dockerfile -t function-docuconf:ci cmd/docuconf
      - name: The image serves
        run: |
          docker run -d --name fn -p 9443:9443 function-docuconf:ci --insecure
          for i in $(seq 1 20); do (exec 3<>/dev/tcp/127.0.0.1/9443) 2>/dev/null && exit 0; sleep 1; done
          docker logs fn
          exit 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      # The SDK's export test runs cue vet against the meta-schema.
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: SDK
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go build ./...
          go vet ./...
          go test -race ./...
      - name: CLI
        working-directory: cmd/docuconf
        env:
          # The pulumi-go and pulumi-python jobs run them, with their
          # dependencies cached.
          DOCUCONF_SKIP_PULUMI_GO: "1"
          DOCUCONF_SKIP_PULUMI_PYTHON: "1"
        run: |
          go build ./...
          go vet ./...
          go test ./...
      # The docs of the spec's example contracts are generated by
      # docuconf docs (spec/cue/testdata/docs); they must be current.
      - name: Generated docs are up to date
        run: |
          (cd cmd/docuconf && go install .)
          spec/cue/testdata/docs/generate.sh --check
      # The CLI pins the SDK by version (cmd/docuconf/go.mod), so that
      # go install works; check and exec also run against this checkout's SDK.
      - name: CLI check and exec against this checkout's SDK
        working-directory: cmd/docuconf
        run: |
          cat > "$RUNNER_TEMP/go.work" <<EOF
          go 1.25.0
          use (
          	$GITHUB_WORKSPACE
          	$GITHUB_WORKSPACE/cmd/docuconf
          )
          EOF
          GOWORK="$RUNNER_TEMP/go.work" go test -run 'Check|Exec' .

  # docuconf pulumi: the generated TypeScript component type-checks under
  # the tsconfig of pulumi new typescript, renders what docuconf render does
  # for every render case, and rejects what vet rejects. It runs on Node
  # with @pulumi/pulumi's mocks (cmd/docuconf/pulumi_test.go).
  pulumi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/docuconf/testdata/pulumi/package-lock.json
      - working-directory: cmd/docuconf/testdata/pulumi
        run: npm ci --no-audit --no-fund
      - working-directory: cmd/docuconf
        env:
          DOCUCONF_SKIP_PULUMI_GO: "1"
          DOCUCONF_SKIP_PULUMI_PYTHON: "1"
        run: go test -count=1 -v -run Pulumi .

  # docuconf pulumi -lang go: the generated component passes go vet, renders
  # what docuconf render does for every render case, and rejects what vet
  # rejects, with the Pulumi Go SDK's mocks (cmd/docuconf/pulumi_go_test.go).
  # Its module pins the Pulumi modules (testdata/pulumi-go).
  pulumi-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            cmd/docuconf/go.sum
            cmd/docuconf/testdata/pulumi-go/go.sum
      - working-directory: cmd/docuconf
        run: go test -count=1 -v -run PulumiGo .

  # docuconf pulumi -lang python: the generated component type-checks with
  # mypy, renders what docuconf render does for every render case, rejects
  # what vet rejects, and renders the ecs and cloudrun targets, with the
  # Pulumi Python SDK's mocks (cmd/docuconf/pulumi_python_test.go).
  # testdata/pulumi-python/requirements.txt pins what it runs with.
  pulumi-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cmd/docuconf/testdata/pulumi-python/requirements.txt
      - working-directory: cmd/docuconf
        run: go test -count=1 -v -run PulumiPython .

  # docuconf terraform: generated modules are applied and compared with
  # docuconf render, on the oldest Terraform they support, the latest, and
  # OpenTofu (cmd/docuconf/terraform_test.go).
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tool: terraform, version: "1.5.7"}
          - {tool: terraform, version: latest}
          - {tool: tofu, version: latest}
    name: terraform (${{ matrix.tool }} ${{ matrix.version }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - if: matrix.tool == 'tofu'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      # The lint tests plan with the kubernetes and aws providers; keep them
      # between runs rather than downloading them every time.
      - name: Provider cache
        uses: actions/cache@v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: providers-${{ matrix.tool }}-${{ hashFiles('cmd/docuconf/*_test.go') }}
          restore-keys: providers-${{ matrix.tool }}-
      - name: Modules match docuconf render
        working-directory: cmd/docuconf
        env:
          DOCUCONF_TERRAFORM: ${{ matrix.tool }}
          TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
          # The tests' roots have no lock file; use the cache anyway.
          TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          go test -count=1 -v -run Terraform .
