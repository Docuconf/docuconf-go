name: go

on:
  push:
    paths-ignore: ["website/**", "docs/**"]
  pull_request:
    paths-ignore: ["website/**", "docs/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # The SDK's export test runs cue vet against the meta-schema.
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: SDK
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go build ./...
          go vet ./...
          go test -race ./...
      - name: CLI
        working-directory: cmd/docuconf
        run: |
          go build ./...
          go vet ./...
          go test ./...
      # The CLI pins the SDK by version (cmd/docuconf/go.mod), so that
      # go install works; check and exec also run against this checkout's SDK.
      - name: CLI check and exec against this checkout's SDK
        working-directory: cmd/docuconf
        run: |
          cat > "$RUNNER_TEMP/go.work" <<EOF
          go 1.25.0
          use (
          	$GITHUB_WORKSPACE
          	$GITHUB_WORKSPACE/cmd/docuconf
          )
          EOF
          GOWORK="$RUNNER_TEMP/go.work" go test -run 'Check|Exec' .
