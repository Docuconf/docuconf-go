name: spec

on:
  push:
    paths: ["spec/**", ".github/workflows/spec.yml"]
  pull_request:
    paths: ["spec/**", ".github/workflows/spec.yml"]

jobs:
  cue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - run: spec/cue/test.sh
