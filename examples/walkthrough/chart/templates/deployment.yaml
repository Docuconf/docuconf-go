apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  {{- with include "docuconf.reloaderAnnotations" . | trim }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with include "docuconf.podLabels" . | trim }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with include "docuconf.podAnnotations" . | trim }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: orders-api
          image: {{ .Values.image }}
          env:
            {{- include "docuconf.env" . | trim | nindent 12 }}
          volumeMounts:
            {{- include "docuconf.volumeMounts" . | trim | nindent 12 }}
      volumes:
        {{- include "docuconf.volumes" . | trim | nindent 8 }}
