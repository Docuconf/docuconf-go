name: orders-go-cloudrun
description: The orders service on Cloud Run, from a Pulumi program in Go, through the component docuconf pulumi -lang go -target cloudrun generates from the contract.
runtime: go
config:
  gcp:project:
    value: acme-prod
  gcp:region:
    value: us-central1
  orders-go-cloudrun:image:
    default: us-docker.pkg.dev/acme-prod/orders/orders-api:2.3.0
  orders-go-cloudrun:environment:
    default: prod
  orders-go-cloudrun:workerCount:
    default: 8
  # The service account the revision runs as. It must be allowed to access
  # each secret (roles/secretmanager.secretAccessor).
  orders-go-cloudrun:serviceAccount:
    default: orders-api@acme-prod.iam.gserviceaccount.com
