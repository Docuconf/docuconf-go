name: orders-ecs
description: The orders service on Amazon ECS (Fargate), from Pulumi, through the component docuconf pulumi -target ecs generates from the contract.
runtime:
  name: nodejs
  options:
    typescript: true
config:
  aws:region:
    value: us-east-1
  orders-ecs:image:
    default: registry.example.com/orders-api:2.3.0
  orders-ecs:environment:
    default: prod
  orders-ecs:workerCount:
    default: 8
  # Where the secrets live. The task execution role must be allowed to read
  # them (secretsmanager:GetSecretValue, ssm:GetParameters).
  orders-ecs:databaseUrlSecretArn:
    default: arn:aws:secretsmanager:us-east-1:123456789012:secret:orders/prod/db-AbCdEf
  orders-ecs:webhookKeysParameterArn:
    default: arn:aws:ssm:us-east-1:123456789012:parameter/orders/prod/webhook-keys
  orders-ecs:executionRoleArn:
    default: arn:aws:iam::123456789012:role/orders-task-execution
