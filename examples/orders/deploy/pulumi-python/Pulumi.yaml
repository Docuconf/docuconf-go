name: orders-python
description: The orders service on Kubernetes, from a Pulumi program in Python, through the component docuconf pulumi -lang python generates from the contract.
runtime:
  name: python
  options:
    toolchain: pip
    virtualenv: venv
config:
  orders-python:namespace:
    default: orders
  orders-python:image:
    default: registry.example.com/orders-api:2.3.0
  orders-python:environment:
    default: prod
  orders-python:workerCount:
    default: 8
