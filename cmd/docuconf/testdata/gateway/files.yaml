routes:
  inline: |
    routes:
      - match: /billing
        upstream: http://billing-api.billing.svc:8080
        timeout: 5s
      - match: /orders
        upstream: http://orders-api.orders.svc:8080
serving-tls:
  certificate:
    name: gateway-tls
    secretName: gateway-tls
    dnsNames: [gateway.internal, "*.example.com"]
    privateKey:
      algorithm: ECDSA
    duration: 2160h
    renewBefore: 720h
upstream-ca:
  configMap:
    name: internal-ca-bundle
    key: ca.crt
partner-keystore:
  csi:
    secretProviderClass: partner-keystore
license:
  inline: "ABCDE-12345-FGHIJ-67890\n"
geoip:
  image:
    reference: registry.example.com/data/geoip@sha256:0f2b5c8d3e4a1b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c
