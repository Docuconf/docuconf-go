# The same App with a port the contract does not allow.
apiVersion: example.org/v1alpha1
kind: App
metadata:
  name: orders
  namespace: orders
spec:
  image: localhost:5000/orders-api:2.3.0
  config:
    values:
      DATABASE_URL:
        secretKeyRef: {name: orders-db, key: url}
      WEBHOOK_KEYS:
        secretKeyRef: {name: orders-webhooks, key: keys}
      LOG_LEVEL: warn
      PORT: 70000
    files:
      serving-tls:
        secret: {name: orders-tls}
