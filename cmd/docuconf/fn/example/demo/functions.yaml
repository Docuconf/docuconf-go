# The composition's functions, for crossplane render: both run on this
# machine (demo.sh starts them), in Crossplane's development runtime.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
  annotations:
    render.crossplane.io/runtime: Development
    render.crossplane.io/runtime-development-target: localhost:9444
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.13.2
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-docuconf
  annotations:
    render.crossplane.io/runtime: Development
    render.crossplane.io/runtime-development-target: localhost:9443
spec:
  package: ghcr.io/docuconf/function-docuconf:v0.1.0
